
name: Gerar Questões de PDF

on:
  push:
    paths:
      - 'pdfs_novos/*.pdf'

permissions:
  contents: write

jobs:
  gerar-questoes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pypdf pydantic

      - name: Executar gerador de questões
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_questoes.py

      - name: Salvar alterações no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add questoes.json pdfs_novos/ pdfs_processados/
          git commit -m "Atualiza banco de questões via PDF [skip ci]" || exit 0
          git push
