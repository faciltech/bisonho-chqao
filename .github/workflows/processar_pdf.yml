name: Gerar Questões de PDF

on:
  workflow_dispatch: # Permite rodar manualmente a qualquer momento com um clique

jobs:
  gerar-questoes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install google-genai pypdf pydantic

      - name: Executar gerador de questões
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gerar_questoes.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add questoes.json pdfs_novos/ pdfs_processados/
          git diff --staged --quiet || git commit -m "Atualiza banco de questões e processa PDFs"
          git push
